'use strict';
window.addEventListener('error', event=>{console.error(event.error||event.message);const n=document.getElementById('notice');if(n){n.textContent='Startup error: '+event.message;n.style.background='#4d1717';n.style.borderColor='#ff9191';n.classList.add('show')}});
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),shell=document.getElementById('shell'),modal=document.getElementById('modal'),panel=document.getElementById('panel'),notice=document.getElementById('notice');
let W=0,H=0,dpr=1,last=0;function resize(){const r=shell.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);W=r.width;H=r.height;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const keys=new Set();addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code))e.preventDefault();keys.add(e.code);if(e.code==='Escape')closeModal()});addEventListener('keyup',e=>keys.delete(e.code));
const CH={rook:{id:'rook',name:'ROOK',speed:245,jump:620,hp:140,color:'#ffb451',accent:'#ffe2a7',double:false},nyx:{id:'nyx',name:'NYX',speed:315,jump:590,hp:90,color:'#b789ff',accent:'#eadbff',double:true}};
const SAVE='deepgate-account-v002';const defaultAccount=()=>({unlockedCharacters:['rook','nyx'],hubStorage:{salvage:0},unlockedPortals:['tutorial','stratum1'],hubUpgrades:{},discoveries:[]});
let accountState=loadAccount();function loadAccount(){try{let d=JSON.parse(localStorage.getItem(SAVE));if(d&&d.hubStorage){d.hubStorage.salvage=Number(d.hubStorage.salvage)||0;return d}}catch(e){}return defaultAccount()}function saveAccount(){try{localStorage.setItem(SAVE,JSON.stringify(accountState))}catch(e){flash('Could not save account data in this browser.')}}
let runState={selectedCharacter:'rook',hp:140,carriedInventory:{salvage:0},tempStats:{},scene:'hub',maxDepth:0,started:false};let scene='hub',player,camera={x:0,y:0},interactLatch=false,resetLatch=false;
const P=(x,y,w,h)=>[x,y,w,h];
const scenes={hub:{name:'TRANSIT HUB',w:1500,h:1700,spawn:{x:735,y:860},platforms:[P(0,1560,1500,100),P(0,1220,1500,46),P(0,830,1500,46),P(0,440,1500,46),P(600,1266,300,294),P(600,876,300,344),P(600,486,300,344),P(150,1320,245,34),P(1105,1320,245,34),P(150,930,245,34),P(1105,930,245,34),P(150,540,245,34),P(1105,540,245,34),P(410,1450,90,32),P(490,1375,90,32),P(1000,1375,90,32),P(1090,1450,90,32),P(410,1060,90,32),P(490,985,90,32),P(1000,985,90,32),P(1090,1060,90,32),P(410,670,90,32),P(490,595,90,32),P(1000,595,90,32),P(1090,670,90,32)],interacts:[{type:'portal',id:'stratum1',x:205,y:1132,w:125,h:88,label:'STRATUM 1',hint:'Press E to enter Stratum 1',active:true},{type:'locked',x:1170,y:1132,w:125,h:88,label:'STRATUM 2',hint:'LOCKED — Reach deeper milestones'},{type:'terminal',x:255,y:762,w:75,h:68,label:'ROSTER',hint:'Press E to select fighter'},{type:'storage',x:1170,y:762,w:75,h:68,label:'STORAGE',hint:'Press E to inspect banked Salvage'},{type:'lift',x:683,y:770,w:134,h:60,label:'LIFT CORE',hint:'Press E to select hub deck'},{type:'locked',x:205,y:742,w:125,h:88,label:'TEST GROUND',hint:'LOCKED — Training systems offline'},{type:'portal',id:'tutorial',x:1170,y:742,w:125,h:88,label:'TUTORIAL',hint:'Press E for the starter route',active:true},{type:'lift',x:683,y:380,w:134,h:60,label:'LIFT CORE',hint:'Press E to select hub deck'},{type:'locked',x:205,y:352,w:125,h:88,label:'WEST ASCENT I',hint:'LOCKED — Elite clearance required'},{type:'locked',x:1170,y:352,w:125,h:88,label:'EAST ASCENT I',hint:'LOCKED — Elite clearance required'},{type:'beacon',x:705,y:705,w:90,h:100,label:'RECOVERY BEACON',hint:'Safe hub recovery point'}]},
tutorial:{name:'TUTORIAL: OUTBOUND WALK',w:2200,h:900,spawn:{x:130,y:690},platforms:[P(0,760,570,90),P(650,690,260,38),P(990,620,250,38),P(1320,680,290,38),P(1710,760,490,90)],interacts:[{type:'sign',x:265,y:676,w:40,h:84,label:'MOVE',hint:'Move with A/D or arrow keys. Jump with Space.'},{type:'sign',x:755,y:606,w:40,h:84,label:'INTERACT',hint:'Press E near portals, terminals, and relays.'},{type:'return',x:1940,y:672,w:105,h:88,label:'SAFE EXTRACTION',hint:'Press E to bank Salvage and return'}],salvage:[{x:725,y:650},{x:1080,y:580},{x:1510,y:640}],hazards:[{x:1390,y:730,w:135,h:30,damage:11}]},
descent:{name:'STRATUM 1: GLOAM CAVERN',w:1750,h:3080,spawn:{x:230,y:190},platforms:[P(0,335,540,75),P(680,440,410,40),P(1270,570,480,40),P(320,735,420,40),P(840,900,400,40),P(1210,1080,400,40),P(620,1250,420,40),P(130,1430,390,40),P(740,1600,440,40),P(1200,1790,420,40),P(430,1975,430,40),P(60,2160,400,40),P(650,2330,420,40),P(1150,2500,430,40),P(590,2690,460,40),P(160,2860,430,40),P(0,3000,1750,100)],interacts:[{type:'return',x:292,y:2772,w:110,h:88,label:'EXTRACTION RELAY',hint:'Press E to secure run and return'},{type:'sign',x:1390,y:2425,w:40,h:75,label:'DEPTH',hint:'Gloam Cavern depth relay — extraction remains below'}],salvage:[{x:760,y:400},{x:1360,y:530},{x:450,y:695},{x:955,y:860},{x:1310,y:1040},{x:740,y:1210},{x:245,y:1390},{x:850,y:1560},{x:1320,y:1750},{x:550,y:1935},{x:180,y:2120},{x:770,y:2290},{x:1270,y:2460},{x:770,y:2650},{x:270,y:2820}],hazards:[{x:900,y:870,w:185,h:30,damage:12},{x:1240,y:1050,w:170,h:30,damage:12},{x:710,y:1220,w:180,h:30,damage:12},{x:785,y:1570,w:200,h:30,damage:13},{x:1270,y:1760,w:190,h:30,damage:13},{x:470,y:1945,w:180,h:30,damage:14},{x:690,y:2320,w:200,h:30,damage:15},{x:650,y:2680,w:210,h:30,damage:16}]}};
function cloneScene(id){const s=scenes[id];return {...s,collected:new Set()}}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
let sceneData=cloneScene('hub');function newPlayer(){const c=CH[runState.selectedCharacter];return{x:0,y:0,w:30,h:44,vx:0,vy:0,onGround:false,jumps:0,face:1,damageInv:0,color:c.color,accent:c.accent}}
function loadScene(id,spawn=null){scene=id;runState.scene=id;sceneData=cloneScene(id);player=newPlayer();const sp=spawn||sceneData.spawn;player.x=sp.x;player.y=sp.y;camera.x=clamp(player.x-W/2,0,Math.max(0,sceneData.w-W));camera.y=clamp(player.y-H/2,0,Math.max(0,sceneData.h-H));if(id!=='hub')runState.started=true}
function freshRun(character=runState.selectedCharacter){runState={selectedCharacter:character,hp:CH[character].hp,carriedInventory:{salvage:0},tempStats:{},scene:'hub',maxDepth:0,started:false};loadScene('hub')}loadScene('hub');
function nearInteract(){let best=null,bd=Infinity,cx=player.x+player.w/2,cy=player.y+player.h/2;for(const it of sceneData.interacts){const d=Math.hypot(cx-(it.x+it.w/2),cy-(it.y+it.h/2));if(d<118&&d<bd){best=it;bd=d}}return best}
function hurt(n){if(player.damageInv>0||scene==='hub')return;runState.hp=Math.max(0,runState.hp-n);player.damageInv=.72;flash('-'+n+' integrity');if(runState.hp<=0)die()}
function die(){showLoss(CH[runState.selectedCharacter].name,runState.carriedInventory.salvage||0,runState.maxDepth)}function bankAndReturn(){const gained=runState.carriedInventory.salvage||0;accountState.hubStorage.salvage=(accountState.hubStorage.salvage||0)+gained;saveAccount();const char=runState.selectedCharacter;freshRun(char);flash(gained?`RUN SECURED — ${gained} Salvage banked.`:'RUN SECURED — No Salvage carried.')}
function update(dt){if(modal.classList.contains('show'))return;const c=CH[runState.selectedCharacter];const dir=(keys.has('KeyA')||keys.has('ArrowLeft')?-1:0)+(keys.has('KeyD')||keys.has('ArrowRight')?1:0);player.vx=dir*c.speed;if(dir)player.face=Math.sign(dir);const jump=keys.has('KeyW')||keys.has('ArrowUp')||keys.has('Space');if(jump&&!player.jumpLatch){if(player.onGround||(c.double&&player.jumps<2)){player.vy=-c.jump;player.onGround=false;player.jumps++}}player.jumpLatch=jump;player.vy=Math.min(970,player.vy+1600*dt);player.damageInv=Math.max(0,player.damageInv-dt);player.x=clamp(player.x+player.vx*dt,0,sceneData.w-player.w);for(const a of sceneData.platforms){const q={x:a[0],y:a[1],w:a[2],h:a[3]};if(overlap(player,q)){if(player.vx>0)player.x=q.x-player.w;else if(player.vx<0)player.x=q.x+q.w}}const oldY=player.y;player.y+=player.vy*dt;player.onGround=false;for(const a of sceneData.platforms){const q={x:a[0],y:a[1],w:a[2],h:a[3]};if(overlap(player,q)){if(player.vy>=0&&oldY+player.h<=q.y+11){player.y=q.y-player.h;player.vy=0;player.onGround=true;player.jumps=0}else if(player.vy<0&&oldY>=q.y+q.h-11){player.y=q.y+q.h;player.vy=0}}}player.y=clamp(player.y,0,sceneData.h-player.h);if(scene!=='hub'){runState.maxDepth=Math.max(runState.maxDepth,Math.max(0,Math.round((player.y-sceneData.spawn.y)/10)));for(const h of sceneData.hazards)if(overlap(player,{x:h.x,y:h.y,w:h.w,h:h.h}))hurt(h.damage);for(let i=0;i<sceneData.salvage.length;i++){if(sceneData.collected.has(i))continue;const s=sceneData.salvage[i];if(Math.hypot(player.x+15-s.x,player.y+22-s.y)<34){sceneData.collected.add(i);runState.carriedInventory.salvage++;flash('+1 Salvage — carry it safely to extraction.')}}}const tx=clamp(player.x+player.w/2-W/2,0,Math.max(0,sceneData.w-W)),ty=clamp(player.y+player.h/2-H/2,0,Math.max(0,sceneData.h-H));camera.x+=(tx-camera.x)*Math.min(1,dt*6);camera.y+=(ty-camera.y)*Math.min(1,dt*6);const it=nearInteract();if(keys.has('KeyE')&&!interactLatch&&it)interact(it);interactLatch=keys.has('KeyE');if(keys.has('KeyR')&&!resetLatch){loadScene(scene);flash('Scene reset.')}resetLatch=keys.has('KeyR')}
function interact(it){if(it.type==='terminal')showRoster();else if(it.type==='storage')showStorage();else if(it.type==='lift')showLift();else if(it.type==='portal'&&it.active){loadScene(it.id);flash(it.id==='tutorial'?'Tutorial route engaged.':'Descent transit complete: Stratum 1.')}else if(it.type==='return')bankAndReturn();else flash(it.hint)}
function showModal(html,cls=''){panel.className='panel '+cls;panel.innerHTML=html;modal.classList.add('show')}function closeModal(){modal.classList.remove('show');panel.innerHTML=''}
function showRoster(){let h='<h2>ROSTER TERMINAL</h2><p>Select an expedition shell. Fighter changes start a fresh base-kit run.</p><div class="choices">';for(const c of Object.values(CH))h+=`<button class="choice" data-char="${c.id}"><h3>${c.name}</h3><small>${c.id==='rook'?'Armored scavenger':'Ruins runner'}</small><p>${c.double?'Fast movement and one aerial double jump.':'Steady movement and a standard single jump.'}</p><span class="tag">HP ${c.hp} • SPEED ${c.speed}${c.double?' • DOUBLE JUMP':''}</span></button>`;h+='</div><div class="footer">Esc closes this terminal.</div>';showModal(h);panel.querySelectorAll('[data-char]').forEach(b=>b.onclick=()=>{const id=b.dataset.char;freshRun(id);closeModal();flash(CH[id].name+' prepared at base integrity.')})}
function showLift(){const decks=[['ASCENT DECK',430],['CENTRAL DECK',820],['DESCENT DECK',1210]];let h='<h2>TRANSIT LIFT</h2><p>Select a hub deck. Lift travel is safe and available to every fighter.</p><div class="choices">';for(const [n,y] of decks)h+=`<button class="choice" data-deck="${y}"><h3>${n}</h3><small>Transit Hub</small><p>Move to the central lift platform on this deck.</p><span class="tag">AVAILABLE</span></button>`;h+='</div><div class="footer">Esc closes lift controls.</div>';showModal(h);panel.querySelectorAll('[data-deck]').forEach(b=>b.onclick=()=>{const y=+b.dataset.deck;const name=b.querySelector('h3').textContent;closeModal();player.x=735;player.y=y-player.h;player.vx=player.vy=0;flash('Lift arrival: '+name+'.')})}
function showStorage(){const n=accountState.hubStorage.salvage||0;showModal(`<h2>HUB STORAGE</h2><p>Only resources secured through extraction are permanent.</p><div style="border:1px solid #3b7b75;padding:20px;background:#0b1d21"><div style="color:#80f2d1;letter-spacing:.12em;font-weight:800">BANKED SALVAGE</div><div style="font-size:44px;font-weight:900;color:#edfff8">${n}</div></div><div class="footer">Carried Salvage is lost on death. Account storage persists through localStorage.</div>`)}
function showLoss(fighter,lost,depth){showModal(`<h2>RUN LOST</h2><p><strong>${fighter}</strong> failed in the field. The current run has been erased.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0"><div class="choice"><small>MAXIMUM DEPTH</small><h3>${depth} m</h3></div><div class="choice"><small>SALVAGE LOST</small><h3>${lost}</h3></div></div><p>Banked Salvage preserved: <strong>${accountState.hubStorage.salvage||0}</strong></p><button class="choice" id="recover" style="width:100%;text-align:center;min-height:auto"><h3>RETURN TO HUB</h3><small>Begin a fresh run with base integrity.</small></button>`,'summary');document.getElementById('recover').onclick=()=>{const id=runState.selectedCharacter;freshRun(id);closeModal();flash('Recovery complete. Carried resources were lost.')};}
let noticeTimer;function flash(t){notice.textContent=t;notice.classList.add('show');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>notice.classList.remove('show'),2500)}function sx(x){return x-camera.x}function sy(y){return y-camera.y}
function draw(){ctx.clearRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,0,H);if(scene==='hub'){g.addColorStop(0,'#15273a');g.addColorStop(1,'#061019')}else if(scene==='tutorial'){g.addColorStop(0,'#203349');g.addColorStop(1,'#0a151e')}else{g.addColorStop(0,'#152033');g.addColorStop(1,'#030609')}ctx.fillStyle=g;ctx.fillRect(0,0,W,H);drawGrid();if(scene==='descent')drawCave();for(const p of sceneData.platforms)drawPlatform(p);for(const h of(sceneData.hazards||[]))drawHazard(h);for(let i=0;i<(sceneData.salvage||[]).length;i++)if(!sceneData.collected.has(i))drawSalvage(sceneData.salvage[i]);for(const it of sceneData.interacts)drawInteract(it);drawPlayer();drawHUD()}
function drawGrid(){ctx.save();ctx.globalAlpha=.16;ctx.strokeStyle='#42708a';for(let x=(-camera.x*.18)%80;x<W;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=(-camera.y*.18)%80;y<H;y+=80){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.restore()}function drawCave(){ctx.fillStyle='#080d13';for(let i=0;i<22;i++){const x=sx((i*227)%sceneData.w),y=sy((i*397)%sceneData.h);ctx.beginPath();ctx.arc(x,y,75+(i%5)*28,0,Math.PI*2);ctx.fill()}}
function drawPlatform(p){const x=sx(p[0]),y=sy(p[1]);ctx.fillStyle=scene==='hub'?'#254257':scene==='tutorial'?'#35556b':'#263640';ctx.fillRect(x,y,p[2],p[3]);ctx.fillStyle=scene==='hub'?'#61a0ae':scene==='tutorial'?'#78b4c9':'#5a7785';ctx.fillRect(x,y,p[2],7);ctx.fillStyle='rgba(0,0,0,.2)';ctx.fillRect(x,y+7,p[2],p[3]-7)}function drawHazard(h){const x=sx(h.x),y=sy(h.y);ctx.save();ctx.shadowBlur=18;ctx.shadowColor='#b5ef53';ctx.fillStyle='#5c9f39';ctx.fillRect(x,y,h.w,h.h);ctx.fillStyle='#cbff72';for(let a=0;a<h.w;a+=22){ctx.beginPath();ctx.moveTo(x+a,y+h.h);ctx.lineTo(x+a+11,y-15);ctx.lineTo(x+a+20,y+h.h);ctx.fill()}ctx.restore()}function drawSalvage(s){const x=sx(s.x),y=sy(s.y);ctx.save();ctx.translate(x,y);ctx.rotate(performance.now()/600);ctx.shadowBlur=15;ctx.shadowColor='#78f1d4';ctx.fillStyle='#91ffe2';ctx.fillRect(-7,-7,14,14);ctx.restore()}
function drawInteract(it){const x=sx(it.x),y=sy(it.y);if(x+it.w<-100||x>W+100||y+it.h<-100||y>H+100)return;ctx.save();if(it.type==='portal'||it.type==='return'){const c=it.type==='return'?'#72f4c7':it.id==='tutorial'?'#62b9ff':'#ffad52';ctx.shadowBlur=24;ctx.shadowColor=c;ctx.strokeStyle=c;ctx.lineWidth=5;ctx.beginPath();ctx.roundRect(x+8,y+3,it.w-16,it.h-4,25);ctx.stroke();ctx.globalAlpha=.22;ctx.fillStyle=c;ctx.fill();ctx.globalAlpha=1;ctx.fillStyle='#e9fcff';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText(it.label,x+it.w/2,y+it.h/2+4)}else if(it.type==='locked'){ctx.strokeStyle='#576675';ctx.lineWidth=4;ctx.strokeRect(x+5,y+5,it.w-10,it.h-10);ctx.fillStyle='rgba(72,82,93,.3)';ctx.fillRect(x+8,y+8,it.w-16,it.h-16);ctx.fillStyle='#a7b0b9';ctx.font='bold 9px system-ui';ctx.textAlign='center';ctx.fillText('LOCKED',x+it.w/2,y+it.h/2+4)}else if(it.type==='terminal'||it.type==='storage'||it.type==='lift'){const c=it.type==='terminal'?'#61dfff':it.type==='storage'?'#77efd1':'#e9d47f';ctx.fillStyle='#102534';ctx.fillRect(x,y,it.w,it.h);ctx.strokeStyle=c;ctx.lineWidth=2;ctx.strokeRect(x,y,it.w,it.h);ctx.fillStyle=c;ctx.fillRect(x+10,y+12,it.w-20,12);ctx.fillStyle='#e1fbff';ctx.font='8px system-ui';ctx.textAlign='center';ctx.fillText(it.label,x+it.w/2,y+50)}else if(it.type==='beacon'){ctx.shadowBlur=24;ctx.shadowColor='#75f6ef';ctx.fillStyle='#8cfff5';ctx.fillRect(x+37,y,it.w-74,it.h);ctx.fillStyle='#174b56';ctx.fillRect(x+7,y+it.h-15,it.w-14,15)}else if(it.type==='sign'){ctx.fillStyle='#e8ce78';ctx.fillRect(x+15,y,10,it.h);ctx.fillStyle='#262419';ctx.font='bold 9px system-ui';ctx.textAlign='center';ctx.fillText(it.label,x+it.w/2,y+25)}ctx.restore()}
function drawPlayer(){const x=sx(player.x),y=sy(player.y);ctx.save();ctx.globalAlpha=player.damageInv>0&&Math.floor(performance.now()/70)%2?0.38:1;ctx.shadowBlur=18;ctx.shadowColor=player.color;ctx.fillStyle=player.color;ctx.fillRect(x,y,player.w,player.h);ctx.fillStyle=player.accent;ctx.fillRect(x+5,y+7,player.w-10,11);ctx.fillStyle='#101824';ctx.fillRect(x+(player.face>0?18:5),y+10,7,4);ctx.restore()}
function drawHUD(){const c=CH[runState.selectedCharacter],it=nearInteract();ctx.save();ctx.fillStyle='rgba(3,10,17,.84)';ctx.fillRect(14,48,280,120);ctx.strokeStyle='#315b74';ctx.strokeRect(14,48,280,120);ctx.fillStyle='#a6e5f5';ctx.font='bold 12px system-ui';ctx.fillText(sceneData.name,26,70);ctx.fillStyle='#e5f6ff';ctx.fillText('FIGHTER: '+c.name,26,94);ctx.fillStyle='#91aabc';ctx.font='11px system-ui';ctx.fillText('INTEGRITY',26,118);ctx.fillStyle='#263845';ctx.fillRect(99,108,165,12);ctx.fillStyle=c.color;ctx.fillRect(99,108,165*(runState.hp/c.hp),12);ctx.fillStyle='#fff';ctx.fillText(runState.hp+' / '+c.hp,160,118);ctx.fillStyle='#86f1d3';ctx.fillText(scene==='hub'?'BANKED SALVAGE: '+(accountState.hubStorage.salvage||0):'CARRIED SALVAGE: '+runState.carriedInventory.salvage,26,145);if(scene==='descent'){ctx.fillStyle='rgba(3,10,17,.84)';ctx.fillRect(W-176,48,162,48);ctx.strokeStyle='#315b74';ctx.strokeRect(W-176,48,162,48);ctx.fillStyle='#9ab8c8';ctx.font='bold 10px system-ui';ctx.fillText('MAX DEPTH THIS RUN',W-162,67);ctx.fillStyle='#ffd184';ctx.font='bold 18px system-ui';ctx.fillText(runState.maxDepth+' m',W-162,87)}if(it){const tx='[E] '+it.hint;ctx.font='bold 13px system-ui';const tw=ctx.measureText(tx).width,bx=W/2-tw/2-15,by=H-66;ctx.fillStyle='rgba(2,7,12,.92)';ctx.fillRect(bx,by,tw+30,34);ctx.strokeStyle='#69d4ed';ctx.strokeRect(bx,by,tw+30,34);ctx.fillStyle='#e9fbff';ctx.textAlign='center';ctx.fillText(tx,W/2,by+22);ctx.textAlign='left')}ctx.restore()}
function frame(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
